apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.memegetbg'
version = '0.1.0'

expoModule {
  // This native module is bundled directly into the app. Publishing it as a
  // standalone Maven artifact is unnecessary, and Expo SDK 56/Gradle 9 fails
  // during release builds if publication metadata/components are absent.
  canBePublished false
}

// The expo-module-gradle-plugin wires up the Android library config
// (compile/min/target SDK from the host app), Kotlin, and the expo-modules-core
// dependency. We only need to declare our namespace and any extra deps.
android {
  namespace 'expo.modules.memegetbg'
  defaultConfig {
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  }
  sourceSets {
    androidTest {
      assets.srcDir 'src/androidTest/fixtures'
    }
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.13.1'
  // Read a linked SAF document's lastModified() for the library's recency sort.
  implementation 'androidx.documentfile:documentfile:1.0.1'

  // Match expo-text-extractor's resolved on-device OCR stack exactly. This
  // module needs a direct compile dependency to expose real OCR geometry.
  implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'

  // Still-image subject cutouts (Task 3.2). Pinned exactly, beta included: the
  // API surface is beta and an unpinned range would move under us. The MODEL is
  // not in this artifact — it is an optional Google Play services module, which
  // is why MemeStillSubjectSegmenter requests it explicitly (see the
  // com.google.mlkit.vision.DEPENDENCIES declaration in AndroidManifest.xml:
  // that only covers Play Store installs, and this app is sideloaded).
  implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'

  // ExoPlayer frame extraction for the last-resort poster path
  // (VideoPlayerFrameExtractor). Pinned to the SAME media3 version expo-video
  // bundles (see its android/build.gradle: androidxMedia3Version) so the app
  // resolves a single coherent ExoPlayer — a mismatched media3 across modules
  // crashes at runtime. Keep this in lockstep whenever expo-video is upgraded.
  implementation 'androidx.media3:media3-transformer:1.9.0'
  implementation 'androidx.media3:media3-effect:1.9.0'
  implementation 'androidx.media3:media3-inspector:1.9.0'

  // Task 0.2 device gate only. The video segmentation gate FAILED, so no
  // production code depends on MediaPipe; still-image cutouts use ML Kit above.
  androidTestImplementation 'com.google.mediapipe:tasks-vision:0.10.29'

  androidTestImplementation 'androidx.test:runner:1.6.2'
  androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
