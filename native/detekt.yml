build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false

complexity:
  active: true
  CyclomaticComplexMethod:
    active: true
    threshold: 18
  LongMethod:
    active: true
    threshold: 90
  LargeClass:
    active: true
    threshold: 500
  NestedBlockDepth:
    active: true
    threshold: 4
  TooManyFunctions:
    active: true
    thresholdInFiles: 25
    thresholdInClasses: 25
    thresholdInInterfaces: 20
    thresholdInObjects: 25
    thresholdInEnums: 15
  LongParameterList:
    active: true
    functionThreshold: 7
    constructorThreshold: 8
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: true
    exceptionNames:
      - Throwable
      - Exception
      - RuntimeException
  SwallowedException:
    active: true

empty-blocks:
  active: true
  EmptyCatchBlock:
    active: true

potential-bugs:
  active: true
  UnsafeCast:
    active: true
  UnsafeCallOnNullableType:
    active: true
  UnreachableCode:
    active: true

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  RedundantSuspendModifier:
    active: true

style:
  active: true
  MagicNumber:
    active: false
  MaxLineLength:
    active: false
  ReturnCount:
    active: false
  WildcardImport:
    active: false
  UnusedPrivateMember:
    active: true
    ignoreAnnotated: ['Preview']
  LoopWithTooManyJumpStatements:
    active: false
  ThrowsCount:
    active: false
  ForbiddenComment:
    active: false
  NewLineAtEndOfFile:
    active: false

naming:
  active: false

comments:
  active: false
