name: CI

# Native Android host tests on pull requests and pushes. The retired Expo app
# no longer needs Node, TypeScript, or Jest in this workflow.

on:
  pull_request:
  push:
    branches:
      - main
      - claude/**
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Host tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
