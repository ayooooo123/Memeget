name: CI

# Native Android host tests, Detekt Kotlin lint, and ast-grep code rules.

on:
  pull_request:
  push:
    branches:
      - main
      - claude/**
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-rules:
    name: ast-grep rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm install --global @ast-grep/cli@0.50.0
      - run: ast-grep test
      - run: ast-grep scan

  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Kotlin Detekt
        run: ./gradlew :app:detekt --no-daemon

      - name: Host tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
