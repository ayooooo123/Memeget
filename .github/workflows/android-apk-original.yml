name: Android APK (original app)

# Builds the original React Native app (com.memeget.app) as a standalone,
# sideloadable APK. The main app is the native one in native/, built and
# released by android-apk.yml; this app is kept for migrating a library to it.
#
# Manual runs only (Actions → "Android APK (original app)" → Run workflow).
# Each run replaces the single rolling "original-latest" pre-release
# (memeget-original-latest.apk).
#
# The RN Android "release" build type signs with the pinned debug keystore
# (signing/debug.keystore), so updates retain the same signing identity.
# The APK runs without a Metro dev server or EAS account.

on:
  workflow_dispatch:

concurrency:
  group: android-apk-original-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Custom embedding models (see docs/embedding-roadmap.md). These are inlined
    # into the JS bundle at build time; the app downloads each file once on
    # first launch from the models-v1 release (built + shape-verified by
    # .github/workflows/export-models.yml). MobileCLIP-S2 replaces CLIP as the
    # primary image/text space (Settings shows an index/model mismatch warning
    # until the library is re-indexed); DINOv2 powers visual similarity.
    env:
      EXPO_PUBLIC_MEMEGET_MOBILECLIP_S2_IMAGE_MODEL_SOURCE: https://github.com/ayooooo123/Memeget/releases/download/models-v1/mobileclip_s2_image_xnnpack_fp32.pte
      EXPO_PUBLIC_MEMEGET_MOBILECLIP_S2_TEXT_MODEL_SOURCE: https://github.com/ayooooo123/Memeget/releases/download/models-v1/mobileclip_s2_text_xnnpack_fp32.pte
      EXPO_PUBLIC_MEMEGET_MOBILECLIP_S2_TOKENIZER_SOURCE: https://github.com/ayooooo123/Memeget/releases/download/models-v1/mobileclip_s2_tokenizer.json
      EXPO_PUBLIC_MEMEGET_DINOV2_IMAGE_MODEL_SOURCE: https://github.com/ayooooo123/Memeget/releases/download/models-v1/dinov2_base_xnnpack_fp32.pte
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine release metadata
        id: meta
        run: |
          VERSION_NAME="$(node -p "require('./app.json').expo.version")"
          RELEASE_TAG="original-latest"
          RELEASE_NAME="Memeget original app (latest build)"
          APK_NAME="memeget-original-latest.apk"
          PRERELEASE="true"
          MAKE_LATEST="false"
          # Use the checked-in local release version as the floor. The old fixed
          # 1000 offset produced CI build 1168 after local builds reached 1170,
          # so Android rejected the newer APK as a downgrade.
          # Keep app.json's versionCode nondecreasing; the workflow run number
          # then keeps successive CI builds increasing and above that floor.
          LOCAL_VERSION_CODE="$(node -p "require('./app.json').expo.android.versionCode")"
          VERSION_CODE="$((LOCAL_VERSION_CODE + GITHUB_RUN_NUMBER))"
          {
            echo "version_name=${VERSION_NAME}"
            echo "version_code=${VERSION_CODE}"
            echo "release_tag=${RELEASE_TAG}"
            echo "release_name=${RELEASE_NAME}"
            echo "apk_name=${APK_NAME}"
            echo "prerelease=${PRERELEASE}"
            echo "make_latest=${MAKE_LATEST}"
          } >> "$GITHUB_OUTPUT"
          echo "Building ${RELEASE_NAME} -> ${APK_NAME} (versionName ${VERSION_NAME}, versionCode ${VERSION_CODE})"

      # Android scopes an app's private storage to its package name, so shipping
      # under a different applicationId does not rename the app — it installs an
      # unrelated one with an empty sandbox, and the user's whole index and every
      # taught example appear to be gone. This has happened. No APK leaves this
      # workflow unless the id is exactly right.
      - name: Verify Android applicationId
        run: |
          EXPECTED='com.memeget.app'
          ACTUAL="$(node -p "require('./app.json').expo.android.package")"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Refusing to build. applicationId is '$ACTUAL', must be '$EXPECTED'."
            echo "Changing it strands every user's library in the old package's sandbox."
            exit 1
          fi
          echo "applicationId OK: $ACTUAL"

      - name: Stamp version into app config
        env:
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
        run: |
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("app.json", "utf8"));
            cfg.expo.version = process.env.VERSION_NAME;
            cfg.expo.android = cfg.expo.android || {};
            cfg.expo.android.versionCode = Number(process.env.VERSION_CODE);
            fs.writeFileSync("app.json", JSON.stringify(cfg, null, 2) + "\n");
            console.log("app.json:", cfg.expo.version, "/", cfg.expo.android.versionCode);
          '

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default also installs the legacy `tools` package, which
          # current cmdline-tools no longer carry ("Failed to find package
          # 'tools'" fails the step). Gradle fetches platforms/build-tools itself.
          packages: platform-tools

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Align Expo-managed package versions
        run: npx expo install --fix
        continue-on-error: true

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        env:
          GRADLE_OPTS: -Xmx5120m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=false
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate and name APK
        id: apk
        run: |
          SRC=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found APK: $SRC"
          DEST="${{ steps.meta.outputs.apk_name }}"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      # Publish first: a GitHub Release stores the APK separately from Actions
      # artifact storage, so it does not consume (or get blocked by) the
      # artifact storage quota. This is the durable download source.
      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: ${{ steps.meta.outputs.release_name }}
          body: |
            The original React Native app (`com.memeget.app`) · standalone debug-signed APK · version `${{ steps.meta.outputs.version_name }}` (build ${{ steps.meta.outputs.version_code }}) · commit `${{ github.sha }}`.

            Install: download the `.apk`, enable "Install unknown apps" for your browser/files app, then open it. Update an existing install in place; don't uninstall it, that deletes its library.

            > The main app is the native one: the `latest` release. This build is kept for moving a library to it.
          files: ${{ steps.apk.outputs.path }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          prerelease: ${{ steps.meta.outputs.prerelease }}

      # Artifact upload is a convenience copy. Keep it short-lived and never let
      # a hit artifact-storage quota fail the build (the Release already has it).
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ steps.meta.outputs.apk_name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 1
