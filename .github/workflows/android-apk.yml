name: Android APK

# Builds Memeget, the native Android app in native/ (Kotlin, Jetpack Compose),
# as a standalone, sideloadable APK:
#
#   * Push to main / manual run on main -> a single rolling "latest" pre-release
#                                          (memeget-latest.apk), replaced each time.
#   * Tag push (v1.2.3)                  -> a permanent, versioned GitHub Release
#                                          tagged v1.2.3 with memeget-v1.2.3.apk.
#   * Manual run on any other branch     -> host tests and the APK as a short-lived
#                                          workflow artifact; nothing is published.
#
# The release build signs with the repository's pinned key
# (signing/debug.keystore, the original app's key too), so every build installs
# over the last one and keeps the library. The original React Native app has
# its own manual workflow, android-apk-original.yml.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# Avoid stacking builds on rapid pushes. Tags and branches have distinct refs,
# so a push to main never cancels an in-flight version release.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine release metadata
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            RELEASE_NAME="Memeget ${GITHUB_REF_NAME}"
            APK_NAME="memeget-${GITHUB_REF_NAME}.apk"
            PRERELEASE="false"
            MAKE_LATEST="true"
            PUBLISH="true"
          else
            RELEASE_TAG="latest"
            RELEASE_NAME="Memeget (latest build)"
            APK_NAME="memeget-latest.apk"
            PRERELEASE="true"
            MAKE_LATEST="false"
            if [[ "${GITHUB_REF}" == refs/heads/main ]]; then PUBLISH="true"; else PUBLISH="false"; fi
          fi
          {
            echo "release_tag=${RELEASE_TAG}"
            echo "release_name=${RELEASE_NAME}"
            echo "apk_name=${APK_NAME}"
            echo "prerelease=${PRERELEASE}"
            echo "make_latest=${MAKE_LATEST}"
            echo "publish=${PUBLISH}"
          } >> "$GITHUB_OUTPUT"
          echo "Building ${RELEASE_NAME} -> ${APK_NAME} (publish: ${PUBLISH})"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The NDK and CMake versions native/app/build.gradle.kts pins. Gradle
          # fetches the platform and build tools itself.
          packages: platform-tools ndk;27.1.12297006 cmake;3.22.1

      # The host tests gate the APK: a failing test stops the build before
      # anything is packaged or published.
      - name: Host tests and release APK
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace

      # Android scopes an app's private storage to its package name and only
      # updates an install signed with the same key. An APK under another
      # applicationId installs as an unrelated app with an empty library, and one
      # signed with another key can't update the installed app at all. No APK
      # leaves this workflow unless both are exactly right.
      - name: Verify package and signing key
        id: apk
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -n 1)"
          PACKAGE="$("${BUILD_TOOLS}/aapt2" dump packagename "${APK}")"
          if [ "${PACKAGE}" != "com.memeget.nativeapp" ]; then
            echo "::error::Refusing to publish. applicationId is '${PACKAGE}', must be 'com.memeget.nativeapp'."
            exit 1
          fi
          EXPECTED_CERT="$(keytool -exportcert -keystore ../signing/debug.keystore -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)"
          # apksigner's wording varies by version ("Signer #1 certificate …",
          # "V2 Signer: certificate …"); every scheme must name the one pinned key.
          ACTUAL_CERT="$("${BUILD_TOOLS}/apksigner" verify --print-certs "${APK}" | sed -n 's/^.*certificate SHA-256 digest: //p' | sort -u)"
          if [ "${ACTUAL_CERT}" != "${EXPECTED_CERT}" ]; then
            echo "::error::Refusing to publish. The APK is signed with '${ACTUAL_CERT}', not the pinned key '${EXPECTED_CERT}'."
            exit 1
          fi
          VERSION_NAME="$("${BUILD_TOOLS}/aapt2" dump badging "${APK}" | sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p")"
          DEST="${GITHUB_WORKSPACE}/${{ steps.meta.outputs.apk_name }}"
          cp "${APK}" "${DEST}"
          echo "Verified ${PACKAGE} ${VERSION_NAME}, signer ${ACTUAL_CERT}"
          {
            echo "path=${DEST}"
            echo "version_name=${VERSION_NAME}"
          } >> "$GITHUB_OUTPUT"

      # Publish first: a GitHub Release stores the APK separately from Actions
      # artifact storage, so it does not consume (or get blocked by) the
      # artifact storage quota. This is the durable download source.
      # Move the rolling `latest` git tag to the new commit before updating the release so GitHub's
      # release header always displays this push's timestamp and SHA instead of an older commit's age.
      - name: Reset rolling latest release and tag
        if: steps.meta.outputs.publish == 'true' && steps.meta.outputs.release_tag == 'latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete latest --cleanup-tag --yes || true

      - name: Publish to Release
        if: steps.meta.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.release_name }}
          body: |
            Memeget for Android (`com.memeget.nativeapp`) · version `${{ steps.apk.outputs.version_name }}` · commit `${{ github.sha }}`.

            Install: download the `.apk` on the phone and open it (allow "Install unknown apps" for your browser or Files app). It updates an earlier release install in place and keeps its library; don't uninstall first. It installs next to the original React Native app (`com.memeget.app`) and doesn't touch it.

            > The `latest` pre-release always tracks the newest build on `main`. For a pinned version, use a tagged release.
          files: ${{ steps.apk.outputs.path }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          append_body: ${{ steps.meta.outputs.prerelease == 'false' }}

      # Artifact upload is a convenience copy (the only copy for branch runs).
      # Keep it short-lived and never let a hit artifact-storage quota fail the
      # build.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ steps.meta.outputs.apk_name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 3
