name: Release (APK + IPA)

# Builds both native apps and publishes them side by side:
#   * Memeget for Android (native/, Kotlin + Jetpack Compose) as a signed, sideloadable APK.
#   * Memeget for iOS (ios/, SwiftUI) as an unsigned IPA for AltStore/SideStore, which sign it on install.
#
#   * Push to main / manual run on main -> a single rolling "latest" pre-release
#                                          (memeget-latest.apk + .ipa), replaced each time.
#   * Tag push (v1.2.3)                  -> a permanent, versioned GitHub Release tagged v1.2.3 with
#                                          memeget-v1.2.3.apk + .ipa. The tag must match MARKETING_VERSION
#                                          in version.xcconfig, the one version both apps carry.
#   * Manual run on any other branch     -> host tests, the APK and the IPA as short-lived workflow
#                                          artifacts; nothing is published.
#
# The Android job creates the release; the iOS job then adds its IPA to it. The release build of the APK
# uses the pinned signing key in signing/debug.keystore, preserving in-place updates and each installed library.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# Avoid stacking builds on rapid pushes. Tags and branches have distinct refs,
# so a push to main never cancels an in-flight version release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: native
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      asset_base: ${{ steps.meta.outputs.asset_base }}
      publish: ${{ steps.meta.outputs.publish }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine release metadata
        id: meta
        run: |
          VERSION="$(sed -n 's/^[[:space:]]*MARKETING_VERSION[[:space:]]*=[[:space:]]*\([^[:space:]]*\).*$/\1/p' ../version.xcconfig)"
          if [ -z "${VERSION}" ]; then
            echo "::error::version.xcconfig has no MARKETING_VERSION."
            exit 1
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
              echo "::error::Refusing to release. Tag ${GITHUB_REF_NAME} does not match MARKETING_VERSION ${VERSION} in version.xcconfig; bump it and re-tag."
              exit 1
            fi
            RELEASE_TAG="${GITHUB_REF_NAME}"
            RELEASE_NAME="Memeget ${GITHUB_REF_NAME}"
            ASSET_BASE="memeget-${GITHUB_REF_NAME}"
            PRERELEASE="false"
            MAKE_LATEST="true"
            PUBLISH="true"
          else
            RELEASE_TAG="latest"
            RELEASE_NAME="Memeget (latest build)"
            ASSET_BASE="memeget-latest"
            PRERELEASE="true"
            MAKE_LATEST="false"
            if [[ "${GITHUB_REF}" == refs/heads/main ]]; then PUBLISH="true"; else PUBLISH="false"; fi
          fi
          {
            echo "version=${VERSION}"
            echo "release_tag=${RELEASE_TAG}"
            echo "release_name=${RELEASE_NAME}"
            echo "asset_base=${ASSET_BASE}"
            echo "prerelease=${PRERELEASE}"
            echo "make_latest=${MAKE_LATEST}"
            echo "publish=${PUBLISH}"
          } >> "$GITHUB_OUTPUT"
          echo "Building ${RELEASE_NAME} (version ${VERSION}) -> ${ASSET_BASE}.apk/.ipa (publish: ${PUBLISH})"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The NDK and CMake versions native/app/build.gradle.kts pins. Gradle
          # fetches the platform and build tools itself.
          packages: platform-tools ndk;27.1.12297006 cmake;3.22.1

      # The host tests gate the APK: a failing test stops the build before
      # anything is packaged or published.
      - name: Host tests and release APK
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace

      # Android scopes an app's private storage to its package name and only
      # updates an install signed with the same key. An APK under another
      # applicationId installs as an unrelated app with an empty library, and one
      # signed with another key can't update the installed app at all. No APK
      # leaves this workflow unless both are exactly right.
      - name: Verify package and signing key
        id: apk
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -n 1)"
          PACKAGE="$("${BUILD_TOOLS}/aapt2" dump packagename "${APK}")"
          if [ "${PACKAGE}" != "com.memeget.nativeapp" ]; then
            echo "::error::Refusing to publish. applicationId is '${PACKAGE}', must be 'com.memeget.nativeapp'."
            exit 1
          fi
          EXPECTED_CERT="$(keytool -exportcert -keystore ../signing/debug.keystore -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)"
          # apksigner's wording varies by version ("Signer #1 certificate …",
          # "V2 Signer: certificate …"); every scheme must name the one pinned key.
          ACTUAL_CERT="$("${BUILD_TOOLS}/apksigner" verify --print-certs "${APK}" | sed -n 's/^.*certificate SHA-256 digest: //p' | sort -u)"
          if [ "${ACTUAL_CERT}" != "${EXPECTED_CERT}" ]; then
            echo "::error::Refusing to publish. The APK is signed with '${ACTUAL_CERT}', not the pinned key '${EXPECTED_CERT}'."
            exit 1
          fi
          VERSION_NAME="$("${BUILD_TOOLS}/aapt2" dump badging "${APK}" | sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p")"
          DEST="${GITHUB_WORKSPACE}/${{ steps.meta.outputs.asset_base }}.apk"
          cp "${APK}" "${DEST}"
          echo "Verified ${PACKAGE} ${VERSION_NAME}, signer ${ACTUAL_CERT}"
          {
            echo "path=${DEST}"
            echo "version_name=${VERSION_NAME}"
          } >> "$GITHUB_OUTPUT"

      # Publish first: a GitHub Release stores the APK separately from Actions
      # artifact storage, so it does not consume (or get blocked by) the
      # artifact storage quota. This is the durable download source.
      # Move the rolling `latest` git tag to the new commit before updating the release so GitHub's
      # release header always displays this push's timestamp and SHA instead of an older commit's age.
      - name: Reset rolling latest release and tag
        if: steps.meta.outputs.publish == 'true' && steps.meta.outputs.release_tag == 'latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete latest --cleanup-tag --yes || true

      - name: Publish to Release
        if: steps.meta.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.release_name }}
          body: |
            Memeget `${{ steps.meta.outputs.version }}` · commit `${{ github.sha }}`.

            **Android** (`com.memeget.nativeapp`, version `${{ steps.apk.outputs.version_name }}`): download the `.apk` on the phone and open it (allow "Install unknown apps" for your browser or Files app). It updates an earlier native release install in place and keeps its library; don't uninstall first.

            **iOS** (`com.memeget.iosapp`, iOS 17+): the `.ipa` is unsigned. Install it with AltStore or SideStore, which sign it with your Apple ID. It is added a few minutes after the APK, once the iOS build finishes.

            > The `latest` pre-release always tracks the newest build on `main`. For a pinned version, use a tagged release.
          files: ${{ steps.apk.outputs.path }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          append_body: ${{ steps.meta.outputs.prerelease == 'false' }}

      # Artifact upload is a convenience copy (the only copy for branch runs).
      # Keep it short-lived and never let a hit artifact-storage quota fail the
      # build.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ steps.meta.outputs.asset_base }}.apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 3

  # Runs after the Android job because that job (re)creates the release this one uploads into; a parallel
  # upload to `latest` could land before the delete-and-recreate and vanish with it.
  ios:
    needs: android
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install xcodegen ninja

      # The pinned ExecuTorch and llama.cpp sources are checksum-gated downloads, and the llama.cpp static
      # library takes most of the build; both only change when these scripts change.
      - name: Cache native runtime
        uses: actions/cache@v4
        with:
          path: |
            native/runtime/build
            ios/build/llama-ios
          key: ios-runtime-${{ runner.os }}-${{ hashFiles('native/runtime/bootstrap.sh', 'ios/scripts/build_llama_ios.sh') }}

      - name: Fetch native runtime
        run: bash native/runtime/bootstrap.sh

      - name: Build llama.cpp for iOS
        run: bash ios/scripts/build_llama_ios.sh ios

      - name: Archive unsigned Release build
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild -project Memeget.xcodeproj -scheme Memeget -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/release/Memeget.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            archive -quiet

      # AltStore/SideStore key an install by bundle ID; another ID installs as a separate app with an empty
      # library. The version must be the one the release names.
      - name: Verify bundle and package IPA
        id: ipa
        working-directory: ios
        run: |
          APP=build/release/Memeget.xcarchive/Products/Applications/Memeget.app
          BUNDLE_ID="$(plutil -extract CFBundleIdentifier raw "${APP}/Info.plist")"
          VERSION="$(plutil -extract CFBundleShortVersionString raw "${APP}/Info.plist")"
          if [ "${BUNDLE_ID}" != "com.memeget.iosapp" ]; then
            echo "::error::Refusing to publish. Bundle ID is '${BUNDLE_ID}', must be 'com.memeget.iosapp'."
            exit 1
          fi
          if [ "${VERSION}" != "${{ needs.android.outputs.version }}" ]; then
            echo "::error::Refusing to publish. The app says version '${VERSION}', the release is '${{ needs.android.outputs.version }}'."
            exit 1
          fi
          rm -rf build/release/ipa
          mkdir -p build/release/ipa/Payload
          ditto "${APP}" build/release/ipa/Payload/Memeget.app
          DEST="${GITHUB_WORKSPACE}/${{ needs.android.outputs.asset_base }}.ipa"
          (cd build/release/ipa && zip -qry "${DEST}" Payload)
          echo "Verified ${BUNDLE_ID} ${VERSION}"
          echo "path=${DEST}" >> "$GITHUB_OUTPUT"

      - name: Add IPA to Release
        if: needs.android.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.android.outputs.release_tag }}" "${{ steps.ipa.outputs.path }}" --clobber

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ needs.android.outputs.asset_base }}.ipa
          path: ${{ steps.ipa.outputs.path }}
          if-no-files-found: error
          retention-days: 3
