name: Memeget
options:
  bundleIdPrefix: com.memeget
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

# The release version shared with Android (MARKETING_VERSION).
configFiles:
  Debug: ../version.xcconfig
  Release: ../version.xcconfig

settings:
  base:
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    SWIFT_VERSION: "5.10"
    GCC_PREPROCESSOR_DEFINITIONS:
      - $(inherited)
      - ET_ON=1
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    HEADER_SEARCH_PATHS:
      - $(inherited)
      - $(PROJECT_DIR)/Memeget/Bridge
      - $(PROJECT_DIR)/../native/core
      - $(PROJECT_DIR)/../native/app/src/main/cpp
      - $(PROJECT_DIR)/../native/runtime/build/llama.cpp/include
      - $(PROJECT_DIR)/../native/runtime/build/llama.cpp/ggml/include
      - $(PROJECT_DIR)/../native/runtime/build/llama.cpp/tools/mtmd
      - $(PROJECT_DIR)/../native/runtime/build/executorch/third-party/include
      - $(PROJECT_DIR)/../native/runtime/build/executorch/third-party/include/cpuinfo
      - $(PROJECT_DIR)/../native/runtime/build/executorch/third-party/include/pthreadpool
    OTHER_LDFLAGS[sdk=iphonesimulator*]:
      - $(inherited)
      - $(PROJECT_DIR)/build/llama-sim/libmemeget_llama.a
      - $(PROJECT_DIR)/../native/runtime/build/executorch/third-party/ios/libs/pthreadpool/simulator-arm64-debug/libpthreadpool.a
      - $(PROJECT_DIR)/../native/runtime/build/executorch/third-party/ios/libs/cpuinfo/libcpuinfo.a
      - -lc++
      - -lz
      - -lsqlite3
    OTHER_LDFLAGS[sdk=iphoneos*]:
      - $(inherited)
      - $(PROJECT_DIR)/build/llama-ios/libmemeget_llama.a
      - $(PROJECT_DIR)/../native/runtime/build/executorch/third-party/ios/libs/pthreadpool/physical-arm64-release/libpthreadpool.a
      - $(PROJECT_DIR)/../native/runtime/build/executorch/third-party/ios/libs/cpuinfo/libcpuinfo.a
      - -lc++
      - -lz
      - -lsqlite3

targets:
  Memeget:
    type: application
    platform: iOS
    sources:
      - path: Memeget
      - path: ../native/core/MemeGateCore.cpp
      - path: ../native/core/LlamaDecisionRunner.cpp
      - path: ../native/core/ResidentSearchCore.cpp
      - path: ../native/core/KnowledgeCore.cpp
      - path: ../native/app/src/main/cpp/LlamaVisionRunner.cpp
      - path: ../native/app/src/main/cpp/ProjectorConversion.cpp
      - path: ../native/app/src/main/assets/knowledge/open_vocab_concepts.bin
        buildPhase: resources
      - path: ../native/app/src/main/assets/knowledge/pairwise_verifier.bin
        buildPhase: resources
      - path: ../native/app/src/main/assets/knowledge/label-prompts.json
        buildPhase: resources
      - path: ../native/app/src/main/assets/knowledge/meme_gate_anchors.bin
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.memeget.iosapp
        INFOPLIST_FILE: Memeget/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Memeget/Bridge/Memeget-Bridging-Header.h
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: "NO"
        CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    dependencies:
      - framework: ../native/runtime/build/executorch/third-party/ios/ExecutorchLib.xcframework
        embed: true
        codeSign: true
      - sdk: Accelerate.framework
      - sdk: Metal.framework
      - sdk: Vision.framework
      - sdk: Photos.framework
      - sdk: AVFoundation.framework
      - sdk: Security.framework
      - sdk: libsqlite3.tbd
      - sdk: libz.tbd

  MemegetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MemegetTests
    dependencies:
      - target: Memeget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.memeget.iosapp.tests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_OBJC_BRIDGING_HEADER: Memeget/Bridge/Memeget-Bridging-Header.h
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: "NO"
        CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]: "NO"
